version: '3.8'

services:
  # === Auth Layer (Sprint 9, Task 1) ===
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      KEYCLOAK_CLIENT_SECRET: bff-client-secret-change-me
      FRONTEND_URL: http://localhost:3000
      API_BASE_URL: http://report-service:8001
      REPORT_SERVICE_URL: http://report-service:8001
      # CALLBACK_URL — используется для redirect_uri.
      # Должен быть внешним URL (как видит браузер), НЕ внутренним Docker-сетевым.
      CALLBACK_URL: http://localhost:8000/auth/callback
      SESSION_COOKIE_NAME: BIONIC_SESSION
      SESSION_TTL_SECONDS: "1800"
      PORT: "8000"
    depends_on:
      - keycloak
      - report-service

  # === Report Service (Sprint 9, Task 2 + Task 3) ===
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      CLICKHOUSE_HOST: olap_db
      CLICKHOUSE_PORT: "8123"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: minio_password
      CDN_BASE_URL: /cdn
    depends_on:
      olap_db:
        condition: service_healthy
      minio:
        condition: service_started

  # === Identity Provider ===
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db

  # === Frontend ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # BFF-паттерн: фронтенд НЕ знает про Keycloak.
      # Все запросы идут через BFF (bionicpro-auth).
      REACT_APP_BFF_URL: http://localhost:8000

  # === LDAP (Task 1.4) ===
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"

  # === CRM Database ===
  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./crm-db:/docker-entrypoint-initdb.d
      - ./postgres-crm-data:/var/lib/postgresql/data
    ports:
      - "5444:5432"

  # === OLAP Database (ClickHouse) ===
  olap_db:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9431:9000"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./olap-db:/docker-entrypoint-initdb.d
      - ./olap-db:/var/lib/clickhouse/user_files
      - ./olap-db/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  # === Object Storage (Task 3) ===
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data

  # === CDN — Nginx reverse proxy + cache (Task 3) ===
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/s3
    depends_on:
      - minio

  # === Airflow (Sprint 9, Task 2 — ETL) ===
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - ./postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  airflow-init:
    image: apache/airflow:2.8.1
    entrypoint: /bin/bash
    command: >
      -c "airflow db init &&
          airflow users create
            --username admin --password admin
            --firstname Admin --lastname User
            --role Admin --email admin@example.com"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-driver psycopg2-binary minio"
    depends_on:
      - airflow_db

  airflow-webserver:
    image: apache/airflow:2.8.1
    command: webserver
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-driver psycopg2-binary minio"
    depends_on:
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.8.1
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-driver psycopg2-binary minio"
    depends_on:
      - airflow-init

volumes:
  minio_storage: {}
  nginx_cache: {}
